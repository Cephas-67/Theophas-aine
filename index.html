<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Arbre généalogique</title>
    <meta
      name="description"
      content="Quatre générations portées par un arbre : le fût est la souche, chaque branche est quelqu un."
    />
    <link rel="icon" href="/favicon.svg" />
    <link rel="stylesheet" href="./src/page.css" />
  </head>
  <body>
    <main id="scene">
      <canvas id="arbre" aria-label="L arbre de la famille, à tourner et à approcher"></canvas>

      <h1 class="titre verre">Arbre généalogique</h1>

      <aside id="fiche" class="fiche verre" hidden aria-live="polite">
        <button id="fermer-fiche" class="fermer" type="button" aria-label="Fermer la fiche">Fermer</button>
        <div id="fiche-contenu"></div>
      </aside>

      <!-- La legende : une ligne par personne, son visage, son nom et ce qu on
           raconte d elle. C est la table des matieres de l arbre, et c est la
           qu on retrouve quelqu un qu on ne sait pas situer sur une branche. -->
      <aside class="legende verre" aria-label="Les personnes de l arbre">
        <ul id="legende-liste" class="legende-liste"></ul>
      </aside>
    </main>

    <!-- La refraction du verre.
         `backdrop-filter` ne sait pas deplacer un pixel : aucune de ses
         fonctions n est un deplacement, donc la lentille ne peut pas s ecrire
         en CSS seul. Un filtre SVG, lui, sait le faire, et Chromium accepte
         qu on le passe a backdrop-filter. La feuille de style ne s en sert que
         la ou il est reconnu ; ailleurs il reste le flou, la saturation et le
         reflet, qui font deja le verre. -->
    <svg class="filtres" aria-hidden="true" focusable="false">
      <filter id="refraction" x="-12%" y="-12%" width="124%" height="124%">
        <feTurbulence type="fractalNoise" baseFrequency="0.008 0.012" numOctaves="2" seed="9" result="onde" />
        <feGaussianBlur in="onde" stdDeviation="3" result="ondeDouce" />
        <feDisplacementMap in="SourceGraphic" in2="ondeDouce" scale="14" xChannelSelector="R" yChannelSelector="G" />
      </filter>
    </svg>

    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
